name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size:check

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            shard: 1/2
            artifact: desktop-1
          - project: desktop
            shard: 2/2
            artifact: desktop-2
          - project: mobile
            shard: 1/1
            artifact: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts-${{ matrix.artifact }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  a11y:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y

  visual:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failure-artifacts
          path: |
            tests/visual/diffs/
            test-results/
            playwright-report/
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      # perf-check launches `channel: 'chrome'`, so the branded build is required
      # rather than the bundled chromium the other browser jobs use.
      - name: Install Chrome for the perf gate
        timeout-minutes: 12
        run: npx playwright install --with-deps chrome
      # The gate starts and stops its own preview server, so there is no manual
      # step to forget and no hardcoded port to collide with.
      - run: npm run test:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-failure-artifacts
          path: output/playwright/
          if-no-files-found: ignore
