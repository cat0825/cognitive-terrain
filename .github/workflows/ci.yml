name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size:check

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            shard: 1/2
            artifact: desktop-1
          - project: desktop
            shard: 2/2
            artifact: desktop-2
          - project: mobile
            shard: 1/1
            artifact: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Bounded retries with an idle timeout: `--with-deps` shells out to apt-get,
      # and a stalled package mirror otherwise hangs silently until the job
      # timeout, which reports as an opaque cancellation instead of a failure.
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install --with-deps chromium
      # The browser binaries come from the cache on a hit, but the OS libraries
      # they link against are not cached and must still be present.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts-${{ matrix.artifact }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  a11y:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Bounded retries with an idle timeout: `--with-deps` shells out to apt-get,
      # and a stalled package mirror otherwise hangs silently until the job
      # timeout, which reports as an opaque cancellation instead of a failure.
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install --with-deps chromium
      # The browser binaries come from the cache on a hit, but the OS libraries
      # they link against are not cached and must still be present.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install-deps chromium
      - run: npm run test:a11y

  visual:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Bounded retries with an idle timeout: `--with-deps` shells out to apt-get,
      # and a stalled package mirror otherwise hangs silently until the job
      # timeout, which reports as an opaque cancellation instead of a failure.
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install --with-deps chromium
      # The browser binaries come from the cache on a hit, but the OS libraries
      # they link against are not cached and must still be present.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failure-artifacts
          path: |
            tests/visual/diffs/
            test-results/
            playwright-report/
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      # perf-check launches `channel: 'chrome'`, so the branded build is required
      # rather than the bundled chromium the other browser jobs use.
      - name: Install Chrome for the perf gate
        timeout-minutes: 12
        run: npx playwright install --with-deps chrome
      # The gate starts and stops its own preview server, so there is no manual
      # step to forget and no hardcoded port to collide with.
      - run: npm run test:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-failure-artifacts
          path: output/playwright/
          if-no-files-found: ignore
