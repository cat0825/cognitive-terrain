name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref. Without this, pushing a fixup left the
# previous run to finish its whole matrix, doubling cost for a result nobody would
# read. `main` is excluded by using run_id as the fallback group, so pushes to the
# default branch always complete and keep a full history of green commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the browser gates need to run at all. A docs-only change
  # cannot alter rendering, so paying for five browser jobs to prove that is
  # waste. This is a job rather than a workflow-level `paths-ignore` because
  # filtering the workflow leaves required checks pending forever on a docs-only
  # PR, blocking the merge instead of speeding it up.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      perf: ${{ steps.filter.outputs.perf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "perf=true" >> "$GITHUB_OUTPUT"
            echo "push build: running every gate"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_REF" HEAD)
          echo "changed files:"
          echo "$changed"
          # Anything outside docs and text assets is treated as app-affecting.
          # Erring toward running the gates keeps a missed pattern from silently
          # skipping coverage.
          if echo "$changed" | grep -qvE '^(docs/|README\.md$|SESSION\.md$|\.github/ISSUE_TEMPLATE/|.*\.md$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change: skipping browser gates"
          fi
          if echo "$changed" | grep -qE '^(\.github/workflows/ci\.yml|scripts/perf-[^/]+\.mjs|tests/unit/perf-(budget|server)\.test\.ts|docs/perf-budget\.md)$'; then
            echo "perf=true" >> "$GITHUB_OUTPUT"
            echo "perf harness change: running hosted perf gate on this PR"
          else
            echo "perf=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size:check

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            shard: 1/4
            artifact: desktop-1
          - project: desktop
            shard: 2/4
            artifact: desktop-2
          - project: desktop
            shard: 3/4
            artifact: desktop-3
          - project: desktop
            shard: 4/4
            artifact: desktop-4
          - project: mobile
            shard: 1/2
            artifact: mobile-1
          - project: mobile
            shard: 2/2
            artifact: mobile-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # System libraries are installed unconditionally and must succeed. An earlier
      # revision skipped this on a browser-cache hit and made it continue-on-error,
      # which turned the visual gate red: the cache holds browser binaries, not the
      # host's font and rendering libraries, so a hit says nothing about whether
      # they are present. Missing fonts changed text rasterisation enough to push
      # the diff ratio to 0.0055 against a 0.002 threshold.
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install-deps chromium
      # Browsers separately, without --with-deps, so the download does not run apt
      # again and cannot be blocked by a package lock.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=240 --idle-timeout=90 --
          npx playwright install chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts-${{ matrix.artifact }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  a11y:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # System libraries are installed unconditionally and must succeed. An earlier
      # revision skipped this on a browser-cache hit and made it continue-on-error,
      # which turned the visual gate red: the cache holds browser binaries, not the
      # host's font and rendering libraries, so a hit says nothing about whether
      # they are present. Missing fonts changed text rasterisation enough to push
      # the diff ratio to 0.0055 against a 0.002 threshold.
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install-deps chromium
      # Browsers separately, without --with-deps, so the download does not run apt
      # again and cannot be blocked by a package lock.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=240 --idle-timeout=90 --
          npx playwright install chromium
      - run: npm run test:a11y

  visual:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # System libraries are installed unconditionally and must succeed. An earlier
      # revision skipped this on a browser-cache hit and made it continue-on-error,
      # which turned the visual gate red: the cache holds browser binaries, not the
      # host's font and rendering libraries, so a hit says nothing about whether
      # they are present. Missing fonts changed text rasterisation enough to push
      # the diff ratio to 0.0055 against a 0.002 threshold.
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install-deps chromium
      # Browsers separately, without --with-deps, so the download does not run apt
      # again and cannot be blocked by a package lock.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=240 --idle-timeout=90 --
          npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failure-artifacts
          path: |
            tests/visual/diffs/
            test-results/
            playwright-report/
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    # Perf is the slowest gate and the most sensitive to runner noise, so it
    # guards every mainline push but only PRs that change the perf harness.
    if: github.event_name == 'push' || needs.changes.outputs.perf == 'true'
    # The software-rendering profile bounds each scenario and uses fewer pointer
    # events, but retain a job-level backstop for browser or runner hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: node scripts/npm-ci-retry.mjs
      # perf-check launches `channel: 'chrome'`, so the branded build is required
      # rather than the bundled chromium the other browser jobs use.
      - name: Install Chrome for the perf gate
        timeout-minutes: 12
        run: >-
          node scripts/run-with-retry.mjs --attempts=3 --timeout=300 --idle-timeout=120 --
          npx playwright install --with-deps chrome
      # The gate starts and stops its own preview server, so there is no manual
      # step to forget and no hardcoded port to collide with.
      # Hosted runners have no GPU, so Chrome falls back to SwiftShader and every
      # frame is rasterised on the CPU. This flag selects budgets and timeouts that
      # describe that environment; without it the gate measures the renderer rather
      # than the application. See docs/perf-budget.md.
      - run: npm run test:perf
        env:
          PERF_SOFTWARE_RENDERING: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-failure-artifacts
          path: output/playwright/
          if-no-files-found: ignore
